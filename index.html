<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viky AI — Video Generator</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header class="topbar"><div class="brand">Viky <span>AI</span></div><div id="credits">Credits: —</div></header>
<section class="hero"><h1>AI Video Generator</h1><p>Create cinematic videos with Veo 3.1 native audio and dialogue.</p></section>
<section class="generator"><label>Video prompt</label><textarea id="prompt" rows="7" placeholder="Example: An old man sits in a village courtyard and says in Urdu, 'Beta, chai le aao.'"></textarea>
<div class="grid"><div><label>Style</label><select id="style"><option value="ai">AI Generated</option><option value="real">Real Life / Photorealistic</option></select></div>
<div><label>Duration</label><select id="duration"><option value="4">4 sec</option><option value="6" selected>6 sec</option><option value="8">8 sec</option><option value="60">1 minute (pipeline)</option></select></div></div>
<label class="upload">Image / Video (optional)<input id="mediaInput" type="file" accept="image/*,video/*"></label>
<label class="switch"><input id="captions" type="checkbox" checked> Automatic captions</label>
<button id="generate" class="generate-btn">Generate Video</button><div id="status" class="status"></div></section>
<section class="recent"><h2>Recent Videos</h2><div id="recentList"></div></section>
</main><script src="app.js"></script><script src="video-generator.js"></script></body></html>
